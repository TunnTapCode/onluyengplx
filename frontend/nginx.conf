server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
